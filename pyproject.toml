[project]
name = "uav-cyber-sim"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "dronecan>=1.0.27",
    "empy==3.3.4",
    "fastcrc>=0.3.5",
    "folium",
    "future>=1.0.0",
    "geopy",
    "ipykernel",
    "ipython",
    "jinja2>=3.1.6",
    "lxml",
    "matplotlib",
    "nbformat",
    "numpy",
    "pandas",
    "plotly",
    "psutil",
    "pymap3d",
    "pymavlink",
    "pyserial",
    "pyzmq",
    "setuptools",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
extend-ignore = ["D205", "D212", "D107", "D105"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "nbstripout>=0.8.1",
    "ruff>=0.14.13",
]
